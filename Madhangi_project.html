<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBox — A Gem Matching Game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap');

  :root{
    --bg-0:#0a0a0d;
    --bg-1:#111116;
    --card-back:#17171f;
    --card-edge:#232330;
    --gold:#c9a227;
    --gold-bright:#f0d585;
    --ivory:#ede6d6;
    --ivory-dim:#a8a297;
    --success:#e8c766;

    --emerald-a:#0f6b4c; --emerald-b:#3fd99a;
    --sapphire-a:#1b4b8a; --sapphire-b:#5fa8f0;
    --ruby-a:#7a1526; --ruby-b:#ea4a63;
    --amethyst-a:#4a2f78; --amethyst-b:#b083e8;
    --topaz-a:#a35e1c; --topaz-b:#f5b544;
    --onyx-a:#0d0d10; --onyx-b:#54545f;
    --pearl-a:#8f8578; --pearl-b:#fdf6e9;
    --citrine-a:#8a6e12; --citrine-b:#ffe066;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #16151c 0%, var(--bg-0) 55%),
      var(--bg-0);
    color:var(--ivory);
    font-family:'Jost', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 60px;
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      repeating-conic-gradient(from 0deg at 50% -20%, rgba(201,162,39,0.03) 0deg 2deg, transparent 2deg 8deg);
    pointer-events:none;
    z-index:0;
  }

  header{
    text-align:center;
    margin-bottom:28px;
    position:relative;
    z-index:1;
  }

  .eyebrow{
    font-family:'Jost',sans-serif;
    letter-spacing:0.45em;
    font-size:11px;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:10px;
    opacity:0.85;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(38px, 7vw, 64px);
    margin:0;
    letter-spacing:0.04em;
    background:linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 55%, #8a6e1f 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(201,162,39,0.15);
  }

  .subtitle{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:17px;
    color:var(--ivory-dim);
    margin-top:6px;
    letter-spacing:0.02em;
  }

  .hud{
    display:flex;
    gap:28px;
    align-items:center;
    margin:26px 0 8px;
    position:relative;
    z-index:1;
  }

  .stat{
    text-align:center;
    min-width:78px;
  }
  .stat-label{
    font-size:10px;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:var(--ivory-dim);
  }
  .stat-value{
    font-family:'Cormorant Garamond', serif;
    font-size:26px;
    color:var(--gold-bright);
    font-weight:600;
    margin-top:2px;
  }

  .divider{
    width:1px;
    height:30px;
    background:linear-gradient(180deg, transparent, var(--card-edge), transparent);
  }

  button.restart{
    font-family:'Jost',sans-serif;
    letter-spacing:0.18em;
    text-transform:uppercase;
    font-size:11px;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-bright);
    padding:10px 18px;
    border-radius:2px;
    cursor:pointer;
    transition:all 0.25s ease;
  }
  button.restart:hover{
    background:var(--gold);
    color:#141410;
    box-shadow:0 0 22px rgba(201,162,39,0.35);
  }

  .board{
    display:grid;
    grid-template-columns:repeat(4, minmax(64px, 90px));
    gap:14px;
    margin-top:30px;
    position:relative;
    z-index:1;
    perspective:1000px;
  }

  .card{
    aspect-ratio:3/4;
    cursor:pointer;
  }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform 0.55s cubic-bezier(.2,.8,.3,1.1);
  }
  .card.flipped .card-inner{
    transform:rotateY(180deg);
  }
  .card.matched .card-inner{
    animation:settle 0.5s ease;
  }
  @keyframes settle{
    0%{filter:brightness(1);}
    45%{filter:brightness(1.6);}
    100%{filter:brightness(1);}
  }

  .card-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .card-back{
    background:
      linear-gradient(155deg, var(--card-back), #0d0d12 60%);
    border:1px solid var(--card-edge);
    box-shadow:inset 0 0 0 1px rgba(201,162,39,0.08), 0 4px 14px rgba(0,0,0,0.5);
  }
  .card-back::after{
    content:'';
    width:46%;
    height:46%;
    border:1px solid rgba(201,162,39,0.55);
    transform:rotate(45deg);
    box-shadow:0 0 10px rgba(201,162,39,0.15);
  }
  .card:not(.matched):hover .card-back{
    border-color:var(--gold);
  }

  .card-front{
    transform:rotateY(180deg);
    background:radial-gradient(ellipse at 30% 20%, #1c1c24, #131318 75%);
    border:1px solid var(--card-edge);
    flex-direction:column;
    gap:6px;
    overflow:hidden;
  }
  .card.matched .card-front{
    border-color:var(--gold);
    box-shadow:0 0 18px rgba(201,162,39,0.35), inset 0 0 12px rgba(201,162,39,0.12);
  }

  .gem{
    width:46%;
    aspect-ratio:1;
    position:relative;
    clip-path:polygon(50% 0%, 90% 25%, 100% 65%, 50% 100%, 0% 65%, 10% 25%);
  }
  .gem::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(155deg, var(--g-bright), var(--g-dark) 70%);
    clip-path:inherit;
  }
  .gem::after{
    content:'';
    position:absolute;
    top:8%; left:22%;
    width:34%; height:24%;
    background:rgba(255,255,255,0.55);
    filter:blur(2px);
    clip-path:polygon(0 0, 100% 20%, 60% 100%, 0 80%);
    opacity:0.7;
  }
  .card.flipped .gem::after{
    animation:shine 0.7s ease 0.15s;
  }
  @keyframes shine{
    0%{opacity:0; transform:translateX(-10px);}
    50%{opacity:0.9;}
    100%{opacity:0.7; transform:translateX(0);}
  }

  .gem-name{
    font-family:'Jost',sans-serif;
    font-size:9.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ivory-dim);
  }

  .emerald{ --g-bright:var(--emerald-b); --g-dark:var(--emerald-a); }
  .sapphire{ --g-bright:var(--sapphire-b); --g-dark:var(--sapphire-a); }
  .ruby{ --g-bright:var(--ruby-b); --g-dark:var(--ruby-a); }
  .amethyst{ --g-bright:var(--amethyst-b); --g-dark:var(--amethyst-a); }
  .topaz{ --g-bright:var(--topaz-b); --g-dark:var(--topaz-a); }
  .onyx{ --g-bright:var(--onyx-b); --g-dark:var(--onyx-a); }
  .pearl{ --g-bright:var(--pearl-b); --g-dark:var(--pearl-a); }
  .citrine{ --g-bright:var(--citrine-b); --g-dark:var(--citrine-a); }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(6,6,8,0.88);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
  }
  .overlay.show{
    opacity:1;
    pointer-events:auto;
  }
  .overlay-panel{
    text-align:center;
    border:1px solid var(--gold);
    padding:48px 56px;
    background:linear-gradient(180deg, #141118, #0c0c10);
    box-shadow:0 0 60px rgba(201,162,39,0.25);
    position:relative;
  }
  .overlay-panel h2{
    font-family:'Cormorant Garamond', serif;
    font-size:40px;
    color:var(--gold-bright);
    margin:0 0 6px;
    letter-spacing:0.05em;
  }
  .overlay-panel p{
    color:var(--ivory-dim);
    font-size:14px;
    margin:0 0 24px;
    font-style:italic;
    font-family:'Cormorant Garamond', serif;
    font-size:18px;
  }
  .overlay-stats{
    display:flex;
    gap:30px;
    justify-content:center;
    margin-bottom:28px;
  }

  .flecks{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
  }
  .fleck{
    position:absolute;
    width:4px; height:4px;
    background:var(--gold-bright);
    top:-10px;
    opacity:0.9;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(105vh) rotate(180deg); opacity:0; }
  }

  footer{
    margin-top:40px;
    font-size:11px;
    color:#5a564c;
    letter-spacing:0.1em;
    position:relative;
    z-index:1;
  }

  @media (max-width:420px){
    .board{ grid-template-columns:repeat(4, minmax(52px, 1fr)); gap:9px; }
    .hud{ gap:16px; }
  }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition:none; }
    .gem::after{ animation:none; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Since 2007 &middot; Private Collections</div>
  <h1>LockBox</h1>
  <div class="subtitle">Match each pair to release the lock</div>
</header>

<div class="hud">
  <div class="stat">
    <div class="stat-label">Moves</div>
    <div class="stat-value" id="moves">0</div>
  </div>
  <div class="divider"></div>
  <div class="stat">
    <div class="stat-label">Time</div>
    <div class="stat-value" id="time">00:00</div>
  </div>
  <div class="divider"></div>
  <button class="restart" id="restart">Reset LockBox</button>
</div>

<div class="board" id="board"></div>

<footer>Sixteen facets &middot; eight pairs &middot; one LockBox</footer>

<div class="overlay" id="overlay">
  <div class="overlay-panel">
    <div class="flecks" id="flecks"></div>
    <h2>LockBox Unlocked</h2>
    <p>Every facet finds its match.</p>
    <div class="overlay-stats">
      <div class="stat">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="final-moves">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="final-time">00:00</div>
      </div>
    </div>
    <button class="restart" id="play-again">Play Again</button>
  </div>
</div>

<script>
  const GEMS = ['emerald','sapphire','ruby','amethyst','topaz','onyx','pearl','citrine'];
  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timeEl = document.getElementById('time');
  const overlay = document.getElementById('overlay');
  const finalMoves = document.getElementById('final-moves');
  const finalTime = document.getElementById('final-time');
  const flecksContainer = document.getElementById('flecks');

  let deck = [];
  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let seconds = 0;
  let timerInterval = null;
  let timerStarted = false;
  let lock = false;

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function formatTime(s){
    const m = Math.floor(s / 60).toString().padStart(2,'0');
    const sec = (s % 60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function startTimer(){
    if(timerStarted) return;
    timerStarted = true;
    timerInterval = setInterval(() => {
      seconds++;
      timeEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer(){
    clearInterval(timerInterval);
  }

  function buildBoard(){
    board.innerHTML = '';
    deck = shuffle([...GEMS, ...GEMS]);
    matchedCount = 0;
    moves = 0;
    seconds = 0;
    flipped = [];
    lock = false;
    timerStarted = false;
    stopTimer();
    movesEl.textContent = '0';
    timeEl.textContent = '00:00';
    overlay.classList.remove('show');

    deck.forEach((gem) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.gem = gem;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back"></div>
          <div class="card-face card-front">
            <div class="gem ${gem}"></div>
            <div class="gem-name">${gem}</div>
          </div>
        </div>
      `;
      card.addEventListener('click', () => handleClick(card));
      board.appendChild(card);
    });
  }

  function handleClick(card){
    if(lock) return;
    if(card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if(flipped.length === 2) return;

    startTimer();
    card.classList.add('flipped');
    flipped.push(card);

    if(flipped.length === 2){
      moves++;
      movesEl.textContent = moves;
      const [a, b] = flipped;
      if(a.dataset.gem === b.dataset.gem){
        a.classList.add('matched');
        b.classList.add('matched');
        matchedCount++;
        flipped = [];
        if(matchedCount === GEMS.length){
          stopTimer();
          setTimeout(showWin, 500);
        }
      } else {
        lock = true;
        setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          flipped = [];
          lock = false;
        }, 800);
      }
    }
  }

  function showWin(){
    finalMoves.textContent = moves;
    finalTime.textContent = formatTime(seconds);
    overlay.classList.add('show');
    spawnFlecks();
  }

  function spawnFlecks(){
    flecksContainer.innerHTML = '';
    for(let i = 0; i < 40; i++){
      const f = document.createElement('div');
      f.className = 'fleck';
      f.style.left = Math.random() * 100 + '%';
      f.style.animationDuration = (2 + Math.random() * 2) + 's';
      f.style.animationDelay = (Math.random() * 1.2) + 's';
      f.style.opacity = 0.5 + Math.random() * 0.5;
      flecksContainer.appendChild(f);
    }
  }

  document.getElementById('restart').addEventListener('click', buildBoard);
  document.getElementById('play-again').addEventListener('click', buildBoard);

  buildBoard();
</script>

</body>
</html>
